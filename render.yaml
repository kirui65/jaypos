services:
  - type: web
    name: jaypos
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --dir apps/api exec prisma generate --schema prisma/schema.prisma && corepack pnpm --dir apps/api db:migrate && corepack pnpm --dir apps/api db:seed:if-empty && corepack pnpm build
    startCommand: corepack pnpm --dir apps/api start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://jaypos-oqmo.onrender.com
      - key: PUBLIC_SHOP_SLUG
        value: main
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: lipwa
      - key: LIPWA_CALLBACK_URL
        value: https://jaypos-oqmo.onrender.com/api/payments/lipwa/callback
      - key: UPLOADS_DIR
        value: ./uploads
