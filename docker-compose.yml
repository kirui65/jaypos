services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eminent_jay
      POSTGRES_USER: eminent
      POSTGRES_PASSWORD: eminent_dev
    ports:
      - "5432:5432"
    volumes:
      - eminent_jay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eminent -d eminent_jay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eminent_jay_postgres:
