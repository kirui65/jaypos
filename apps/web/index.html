<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Retail point of sale</title>
  </head>
  <body class="public-login">
    <div id="root">
      <main class="login-page">
        <div class="login-backdrop" aria-hidden="true"></div>
        <section class="login-brand-panel" aria-label="Eminent Jay branding">
          <img id="login-logo" class="login-logo" src="/logo.png" alt="Eminent Jay logo" width="1600" height="600" fetchpriority="high" />
          <div class="login-brand-copy">
            <span class="gold-rule" aria-hidden="true"></span>
            <p>Sales, stock and customer care in one place.</p>
          </div>
        </section>
        <section class="login-card" aria-labelledby="login-title">
          <header class="login-card-header">
            <p class="login-kicker">SECURE SHOP ACCESS</p>
            <h1 id="login-title">Welcome back</h1>
            <p id="login-subtitle" class="muted">Manage inventory, reports and staff.</p>
          </header>
          <form id="login-form" class="stack-form" autocomplete="off">
            <p id="login-role-label" class="login-field-label">Sign in as</p>
            <div class="role-selector" role="radiogroup" aria-labelledby="login-role-label">
              <button
                type="button"
                class="role-option role-option-active"
                role="radio"
                aria-checked="true"
                data-role-option="admin"
              >
                <svg class="ej-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                <span>Admin</span>
              </button>
              <button
                type="button"
                class="role-option"
                role="radio"
                aria-checked="false"
                data-role-option="staff"
              >
                <svg class="ej-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                <span>Cashier</span>
              </button>
            </div>
            <label class="field">
              <span>Username</span>
              <input name="identifier" autocomplete="off" data-lpignore="true" data-1p-ignore="true" placeholder="Enter your username" required />
            </label>
            <label class="field">
              <span>PIN</span>
              <small>Use your temporary password once if you have not set a PIN yet.</small>
              <input name="pin" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" placeholder="Enter your PIN" required />
            </label>
            <div id="login-error" class="notice notice-error" role="alert" hidden></div>
            <button id="login-submit" class="button button-full button-lg">Sign in as Admin</button>
            <p class="login-security-note">Access is limited to authorized team members.</p>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
