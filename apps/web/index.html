<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14243A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Retail point of sale</title>
  </head>
  <body class="public-login">
    <div id="root">
      <main class="login-page">
        <div class="login-backdrop" aria-hidden="true"></div>
        <section class="login-card" aria-labelledby="login-title">
          <img id="login-logo" class="login-logo" alt="Shop logo" width="220" height="220" fetchpriority="high" hidden />
          <div class="gold-rule"></div>
          <p class="login-brand-name" data-brand-name>Shop</p>
          <p class="login-kicker">RETAIL POINT OF SALE</p>
          <h1 id="login-title">Sign in to the till</h1>
          <p class="muted">Sign in to open your shop till.</p>
          <form id="login-form" class="stack-form">
            <label class="field">
              <span>Username or email</span>
              <input name="identifier" autocomplete="username" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <div id="login-error" class="notice notice-error" role="alert" hidden></div>
            <button id="login-submit" class="button button-full button-lg">Sign in</button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
